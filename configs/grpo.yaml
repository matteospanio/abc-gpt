# trl grpo --config configs/grpo.yaml
# GRPO: for each prompt the model writes num_generations tunes; the rewards below score them and the
# model is pushed towards the better ones of each group.
model_name_or_path: models/gpt2-abc-sft
dataset_name: data/grpo
dataset_train_split: train
output_dir: models/gpt2-abc-grpo

reward_funcs:              # dotted paths to functions in src/abcgpt/rewards.py
  - abcgpt.rewards.syntax
  - abcgpt.rewards.meter
  - abcgpt.rewards.note_order
reward_weights: [1.0, 1.0, 0.5]

num_generations: 8         # tunes per prompt (the group)
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
max_completion_length: 384
temperature: 1.0
learning_rate: 1.0e-5
beta: 0.0                  # KL penalty towards the starting model; 0 disables it
max_steps: 500
bf16: true

logging_steps: 10
save_strategy: steps
save_steps: 250
report_to: wandb           # none to disable; also tensorboard, trackio (project and mode: see run.sh)
run_name: grpo
log_completions: true      # a table of prompts, generated tunes and rewards every logging_steps
num_completions_to_print: 2  # how many of them are also printed in the terminal
seed: 42
