# trl sft --config configs/pretrain.yaml
# Pretraining from scratch: next-token prediction on raw ABC text, starting from random weights.
model_name_or_path: models/gpt2-abc-init
dataset_name: sander-wood/irishman
dataset_text_field: abc notation
dataset_train_split: train
dataset_test_split: validation
output_dir: models/gpt2-abc-pretrain

max_length: 512            # most tunes fit; longer ones are truncated
packing: false             # with GPT-2 and SDPA attention, packing would let tunes attend to each other
num_train_epochs: 3
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
gradient_accumulation_steps: 1
learning_rate: 6.0e-4
lr_scheduler_type: cosine
warmup_steps: 500
weight_decay: 0.1
bf16: true

eval_strategy: steps
eval_steps: 2000
logging_steps: 50
save_strategy: steps
save_steps: 2000
save_total_limit: 2
report_to: none            # tensorboard or trackio to get curves
seed: 42
