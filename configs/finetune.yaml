# trl sft --config configs/finetune.yaml
# Finetuning: prompt = control code (as an ABC comment) + header, completion = tune body.
# With prompt-completion data the loss is computed on the completion only.
model_name_or_path: models/gpt2-abc-pretrain
dataset_name: data/finetune
dataset_train_split: train
dataset_test_split: validation
output_dir: models/gpt2-abc-sft

max_length: 512
num_train_epochs: 1
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_steps: 200
bf16: true

# LoRA through PEFT: set use_peft to true to train adapters only
use_peft: false
lora_r: 16
lora_alpha: 32
lora_target_modules: [c_attn, c_proj, c_fc]

eval_strategy: steps
eval_steps: 1000
logging_steps: 50
save_strategy: steps
save_steps: 2000
save_total_limit: 2
report_to: none
seed: 42
