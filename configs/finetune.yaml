# trl sft --config configs/finetune.yaml
# Finetuning: prompt = control code (as an ABC comment) + header, completion = tune body.
# With prompt-completion data the loss is computed on the completion only.
model_name_or_path: models/gpt2-abc-pretrain
dataset_name: data/finetune
dataset_train_split: train
dataset_test_split: validation
output_dir: models/gpt2-abc-sft

max_length: 512            # the data stage already dropped the longer tunes (max_tokens)
train_sampling_strategy: group_by_length  # batches of tunes of similar length: much less padding to compute
num_train_epochs: 1
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
learning_rate: 5.0e-5      # same tunes as pretraining, which ended near lr 0: at 2e-4 the loss went back up
lr_scheduler_type: cosine
warmup_steps: 200
bf16: true

# LoRA through PEFT: set use_peft to true to train adapters only
use_peft: false
lora_r: 16
lora_alpha: 32
lora_target_modules: [c_attn, c_proj, c_fc]

eval_strategy: steps
eval_steps: 1000
logging_steps: 50
save_strategy: steps
save_steps: 2000
save_total_limit: 2
report_to: wandb           # none to disable; also tensorboard, trackio (project and mode: see run.sh)
run_name: finetune
seed: 42
