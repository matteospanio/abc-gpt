[project]
name = "abcgpt"
version = "0.1.0"
description = "Companion code: a small GPT-2 trained from scratch on Irish tunes in ABC notation, then finetuned with SFT and GRPO using the Hugging Face stack."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.10",
    "datasets>=4.0",
    "datatrove>=0.10",
    "music21>=9.1",
    "peft>=0.17",
    "tokenizers>=0.21",
    "torch>=2.6",
    "transformers>=5.0",
    "trl>=1.0",
    "wandb>=0.21",
]

[project.optional-dependencies]
demo = ["gradio[mcp]>=6.0"]  # the [mcp] extra pins the mcp version Gradio supports (1.x: 2.x has no Server.call_tool)

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abcgpt"]

[tool.uv]
# uv's own Python builds ship the C headers (Python.h) that Triton needs to compile its CUDA helper
# the first time a kernel runs; a system Python often lacks them (python3.x-dev package)
python-preference = "only-managed"
