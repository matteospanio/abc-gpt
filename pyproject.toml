[project]
name = "abcgpt"
version = "0.1.0"
description = "Companion code: a small GPT-2 trained from scratch on Irish tunes in ABC notation, then finetuned with SFT and GRPO using the Hugging Face stack."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.10",
    "datasets>=4.0",
    "music21>=9.1",
    "peft>=0.17",
    "tokenizers>=0.21",
    "torch>=2.6",
    "transformers>=5.0",
    "trl>=1.0",
]

[project.optional-dependencies]
demo = ["gradio>=6.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abcgpt"]
